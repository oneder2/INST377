<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.css">
    <script type="importmap">
        {
            "imports": 
            {
                "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.js"
            }
        }
    </script>
</head>
<body>
    <div id="map" style="height: 600px"></div>
	<script type="module">
        import {LeafletMap, TileLayer, Marker} from 'leaflet';

        function getRandomInRange(from, to, fixed) {
            return (Math.random() * (to - from) + from).toFixed(fixed) * 1;
        }
        
        async function getLocalInfo(latitude, longitude){
            const response = await fetch(
                "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en"
            ).then(response => {
                return response.json()
            }).then(res => {
                console.log(res)
            });
        }

        function generatePoint(index, map){
            var latitude = getRandomInRange(30, 35, 3);
            var longitude = getRandomInRange(-90, -100, 3);

            const marker = new Marker([latitude, longitude]).addTo(map);
            marker.bindPopup("I am marker " + index + ".").openPopup();

            getLocalInfo(latitude, longitude);
        }

        function drawMap(){
            const map = new LeafletMap('map').setView([32.5, -95], 7);

            new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
            
            for (var i=1; i<=3; i++){
                generatePoint(i, map);
            }
        }


        drawMap();

	</script>
    <h2>Marker 1 (Randomly Generated Coordinates Point 1)</h2>
    <p id="marker1"></p>

    <h2>Marker 2 (Randomly Generated Coordinates Point 2)</h2>
    <p id="marker2"></p>

    <h2>Marker 3 (Randomly Generated Coordinates Point 3)</h2>
    <p id="marker3"></p>

</body>
</html>
